<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/app.css" | relURL }}">
    {{ with .Params.syndication_link }}
        <link rel="canonical" href="https://example.com/original-article">
    {{ end }}
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png?v=20260913" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg?v=20260913" />
    <link rel="shortcut icon" href="/favicons/favicon.ico?v=20260913" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png?v=20260913" />
    <meta name="apple-mobile-web-app-title" content="WWC" />
    <link rel="manifest" href="/favicons/site.webmanifest?v=20260913" />
    <!-- OPEN GRAPH -->
    {{ $description := .Params.subtitle | default (.Summary | plainify | truncate 160) }}
    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ $description }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ site.Title }}">
    <meta property="og:image" content="{{ .Params.cover | default "/wwc-opengraph.png" | absURL }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta name="twitter:description" content="{{ $description }}">
    <meta property="twitter:image" content="{{ .Params.cover | default "/wwc-opengraph.png" | absURL }}">

    <!-- RSS -->
    <link rel="alternate" type="application/rss+xml" title="Web Writers’ Collective" href="https://webwriterscollective.com/feed"/>

    {{ block "head" . }}{{ end }}
</head>
<body class="max-w-350 mx-auto {{ delimit (split (strings.Trim .RelPermalink "/") "/") " " }}">
  {{ partial "nav.html" . }}
  <main class="mx-1 lg:mx-1.5 py-6">
      {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
</body>
</html>
